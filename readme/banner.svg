  <text x="550" y="292" text-anchor="middle" fill="#FFFFFF" font-family="Oswald, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600">There is roughly $3,000 / month available for</text>
  <text x="550" y="332" text-anchor="middle" fill="#FFFFFF" font-family="Oswald, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600">someone who helps.</text>
  <text x="550" y="398" text-anchor="middle" fill="#FBBF24" font-family="Oswald, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600">Production AI, not demos</text>
  <text x="550" y="444" text-anchor="middle" fill="#FBBF24" font-family="Oswald, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600">Let's work together on this</text>
  <text x="550" y="490" text-anchor="middle" fill="#FBBF24" font-family="Oswald, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600">Roughly $3,000/month available</text>
